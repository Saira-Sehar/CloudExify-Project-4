<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizaara | Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">

    <!-- Admin Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top admin-navbar">
        <div class="container">
            <a class="navbar-brand" href="admin.html">
                Mizaara<span style="color: #C49A5A;">.</span> <span class="admin-badge">Admin</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="admin-menu.html" class="btn btn-outline-light btn-sm">Manage Menu</a>
                <button class="btn-logout" id="adminLogoutBtn">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Dashboard Section -->
    <section class="admin-section">
        <div class="container">
            <div class="section-header text-center">
                <span class="section-subtitle">Dashboard</span>
                <h2 class="section-title">Restaurant <span style="color: #C49A5A;">Overview</span></h2>
            </div>

            <!-- Stats Cards - Icon + Label side by side, Number below -->
            <div class="row g-4 mb-5">
                <div class="col-md-3 col-6">
                    <div class="admin-stat-card">
                        <div class="stat-header">
                            <i class="bi bi-receipt stat-icon"></i>
                            <span class="stat-label">Today's Orders</span>
                        </div>
                        <span class="stat-number" id="todayOrders">0</span>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="admin-stat-card">
                        <div class="stat-header">
                            <i class="bi bi-cash-stack stat-icon"></i>
                            <span class="stat-label">Today's Revenue</span>
                        </div>
                        <span class="stat-number" id="todayRevenue">₨0</span>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="admin-stat-card">
                        <div class="stat-header">
                            <i class="bi bi-hourglass-split stat-icon"></i>
                            <span class="stat-label">Pending Orders</span>
                        </div>
                        <span class="stat-number" id="pendingOrders">0</span>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="admin-stat-card">
                        <div class="stat-header">
                            <i class="bi bi-list-check stat-icon"></i>
                            <span class="stat-label">Menu Items</span>
                        </div>
                        <span class="stat-number" id="totalItems">0</span>
                    </div>
                </div>
            </div>

            <!-- Revenue Chart -->
            <div class="admin-chart-card mb-5">
                <h3 class="chart-title"><i class="bi bi-graph-up"></i> Last 7 Days Revenue</h3>
                <div class="chart-container" id="revenueChart">
                    <!-- Bars rendered dynamically -->
                </div>
            </div>

            <!-- Orders Table -->
            <div class="admin-table-card">
                <h3 class="table-title"><i class="bi bi-clipboard-data"></i> All Orders</h3>
                <div class="table-responsive">
                    <table class="table admin-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <tr><td colspan="6" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
