<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizaara | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-back"><i class="bi bi-arrow-left"></i> Back to Home</a>
                <div class="auth-logo">Mizaara<span class="accent">.</span></div>
                <p class="auth-tagline">Where Every Flavor Meets</p>
            </div>
            
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join Mizaara for a delicious experience</p>
            
            <div class="auth-error d-none" id="registerError">
                <i class="bi bi-exclamation-circle"></i>
                <span id="registerErrorMessage"></span>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-with-icon">
                        <i class="bi bi-person"></i>
                        <input type="text" id="registerName" placeholder="Your full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-with-icon">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="registerEmail" placeholder="your@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-with-icon">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="registerPassword" placeholder="Minimum 6 characters" required minlength="6">
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom btn-lg w-100" id="registerBtn">
                    <i class="bi bi-person-plus me-2"></i> Register
                </button>
            </form>
            
            <p class="auth-switch">
                Already have an account? <a href="login.html">Login Here</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
